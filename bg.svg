<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03050a"/><stop offset=".5" stop-color="#0a1020"/><stop offset="1" stop-color="#0b1b17"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3cf" stop-opacity=".5"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0c0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffd98a" stop-opacity=".35"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1222"/><stop offset="1" stop-color="#05070e"/>
    </linearGradient>
    <linearGradient id="ad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e30613"/><stop offset=".5" stop-color="#d9b45b"/><stop offset="1" stop-color="#e30613"/>
    </linearGradient>
    <radialGradient id="spot" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2fae6b" stop-opacity=".55"/><stop offset="1" stop-color="#2fae6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ball" cx=".38" cy=".35" r=".7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9bec9"/>
    </radialGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".88"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".6"/>
    </linearGradient>
    <pattern id="crowd" width="22" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1.6" fill="#ffd9a0" opacity=".30"/>
      <circle cx="11" cy="9" r="1.6" fill="#e30613" opacity=".55"/>
      <circle cx="17" cy="3" r="1.4" fill="#ffffff" opacity=".35"/>
      <circle cx="7" cy="12" r="1.3" fill="#e30613" opacity=".35"/>
      <circle cx="19" cy="11" r="1.5" fill="#ffd9a0" opacity=".25"/>
    </pattern>
    <clipPath id="pitchClip"><polygon points="360,560 1240,560 1740,900 -140,900"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- tribune -->
  <polygon points="0,380 1600,380 1600,560 0,560" fill="url(#stand)"/>
  <polygon points="0,380 1600,380 1600,560 0,560" fill="url(#crowd)"/>
  <rect x="0" y="378" width="1600" height="3" fill="#d9b45b" opacity=".35"/>
  <rect x="0" y="548" width="1600" height="12" fill="url(#ad)" opacity=".55"/>

  <!-- lysmaster venstre -->
  <g>
    <polygon points="160,100 20,560 760,560" fill="url(#beam)" opacity=".55"/>
    <polygon points="160,100 470,560 1180,560" fill="url(#beam)" opacity=".4"/>
    <rect x="156" y="100" width="8" height="280" fill="#05070d"/>
    <circle cx="160" cy="82" r="150" fill="url(#glow)"/>
    <rect x="112" y="60" width="96" height="48" rx="4" fill="#0a0d16" stroke="#d9b45b" stroke-opacity=".5"/>
    <g fill="#fff6d8">
      <circle cx="128" cy="74" r="5"/><circle cx="148" cy="74" r="5"/><circle cx="168" cy="74" r="5"/><circle cx="188" cy="74" r="5"/>
      <circle cx="128" cy="94" r="5"/><circle cx="148" cy="94" r="5"/><circle cx="168" cy="94" r="5"/><circle cx="188" cy="94" r="5"/>
    </g>
  </g>
  <!-- lysmaster høyre -->
  <g>
    <polygon points="1440,100 1580,560 840,560" fill="url(#beam)" opacity=".55"/>
    <polygon points="1440,100 1130,560 420,560" fill="url(#beam)" opacity=".4"/>
    <rect x="1436" y="100" width="8" height="280" fill="#05070d"/>
    <circle cx="1440" cy="82" r="150" fill="url(#glow)"/>
    <rect x="1392" y="60" width="96" height="48" rx="4" fill="#0a0d16" stroke="#d9b45b" stroke-opacity=".5"/>
    <g fill="#fff6d8">
      <circle cx="1408" cy="74" r="5"/><circle cx="1428" cy="74" r="5"/><circle cx="1448" cy="74" r="5"/><circle cx="1468" cy="74" r="5"/>
      <circle cx="1408" cy="94" r="5"/><circle cx="1428" cy="94" r="5"/><circle cx="1448" cy="94" r="5"/><circle cx="1468" cy="94" r="5"/>
    </g>
  </g>

  <!-- bane -->
  <g clip-path="url(#pitchClip)">
    <rect x="-200" y="560" width="2000" height="340" fill="#0c3d26"/>
    <rect x="-200" y="585" width="2000" height="30" fill="#0f4a2e"/>
    <rect x="-200" y="655" width="2000" height="50" fill="#0f4a2e"/>
    <rect x="-200" y="770" width="2000" height="80" fill="#0f4a2e"/>
    <ellipse cx="800" cy="700" rx="900" ry="200" fill="url(#spot)"/>
    <rect x="-200" y="560" width="2000" height="340" fill="url(#floor)"/>
    <g fill="none" stroke="#eaf5ee" stroke-opacity=".38" stroke-width="3">
      <line x1="-200" y1="705" x2="1800" y2="705"/>
      <ellipse cx="800" cy="705" rx="210" ry="48"/>
      <polyline points="600,560 582,597 1018,597 1000,560"/>
      <polyline points="700,560 692,578 908,578 900,560"/>
    </g>
    <circle cx="800" cy="705" r="4" fill="#eaf5ee" opacity=".5"/>
  </g>
  <polyline points="360,560 -140,900" stroke="#eaf5ee" stroke-opacity=".3" stroke-width="3" fill="none"/>
  <polyline points="1240,560 1740,900" stroke="#eaf5ee" stroke-opacity=".3" stroke-width="3" fill="none"/>

  <!-- ball -->
  <ellipse cx="800" cy="726" rx="34" ry="7" fill="#000" opacity=".45"/>
  <circle cx="800" cy="690" r="46" fill="url(#glow)" opacity=".5"/>
  <circle cx="800" cy="690" r="22" fill="url(#ball)" stroke="#1a1d26" stroke-opacity=".5"/>
  <polygon points="800,680 809.5,687 805.9,698.1 794.1,698.1 790.5,687" fill="#10131c"/>
  <g stroke="#10131c" stroke-width="1.6" stroke-linecap="round">
    <line x1="800" y1="680" x2="800" y2="672"/><line x1="809.5" y1="687" x2="817" y2="684"/>
    <line x1="805.9" y1="698.1" x2="811" y2="705"/><line x1="794.1" y1="698.1" x2="789" y2="705"/>
    <line x1="790.5" y1="687" x2="783" y2="684"/>
  </g>

  <rect width="1600" height="900" fill="url(#vig)"/>
</svg>
